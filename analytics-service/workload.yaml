apiVersion: openchoreo.dev/v1alpha1

metadata:
  name: analytics-service

endpoints:
  - name: analytics
    port: 8081
    type: HTTP

connections:
  postgres:
    type: api
    params:
      projectName: url-shortener
      componentName: postgres
      endpoint: postgres
    inject:
      env:
        - name: POSTGRES_DSN
          value: "postgres://postgres:postgres@{{ .host }}:{{ .port }}/urlshortener?sslmode=disable"
  redis:
    type: api
    params:
      projectName: url-shortener
      componentName: redis
      endpoint: redis
    inject:
      env:
        - name: REDIS_ADDR
          value: "{{ .host }}:{{ .port }}"

configurations:
  env:
    - name: PORT
      value: "8081"
    - name: POSTGRES_DSN
      value: "postgres://postgres:postgres@postgres:5432/urlshortener?sslmode=disable"
    - name: REDIS_ADDR
      value: "redis:6379"
    - name: OTEL_ENABLED
      value: "true"
    - name: OTEL_EXPORTER_ENDPOINT
      value: "http://opentelemetry-collector.openchoreo-observability-plane.svc.cluster.local:4318"
