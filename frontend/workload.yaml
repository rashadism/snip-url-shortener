apiVersion: openchoreo.dev/v1alpha1

metadata:
  name: frontend

endpoints:
  - name: webapp
    port: 3000
    type: HTTP
    visibility: [external]

connections:
  - name: api-service
    type: api
    params:
      projectName: url-shortener
      componentName: api-service
      endpoint: api
    inject:
      env:
        - name: API_SERVICE_URL
          value: "http://{{ .host }}:{{ .port }}"
  - name: analytics-service
    type: api
    params:
      projectName: url-shortener
      componentName: analytics-service
      endpoint: analytics
    inject:
      env:
        - name: ANALYTICS_SERVICE_URL
          value: "http://{{ .host }}:{{ .port }}"

configurations:
  env:
    - name: PORT
      value: "3000"
    - name: API_SERVICE_URL
      value: "http://api-service:8080"
    - name: ANALYTICS_SERVICE_URL
      value: "http://analytics-service:8081"
    - name: OTEL_ENABLED
      value: "true"
    - name: OTEL_EXPORTER_ENDPOINT
      value: "http://opentelemetry-collector.openchoreo-observability-plane.svc.cluster.local:4318"
