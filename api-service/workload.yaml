apiVersion: openchoreo.dev/v1alpha1

metadata:
  name: api-service

endpoints:
  - name: api
    port: 8080
    type: REST

configurations:
  env:
    - name: PORT
      value: "8080"
    - name: POSTGRES_DSN
      value: "postgres://postgres:postgres@postgres:80/urlshortener?sslmode=disable"
    - name: REDIS_ADDR
      value: "redis:80"
    - name: OTEL_ENABLED
      value: "true"
    - name: OTEL_EXPORTER_ENDPOINT
      value: "http://opentelemetry-collector.openchoreo-observability-plane.svc.cluster.local:4318"
