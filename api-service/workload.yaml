apiVersion: openchoreo.dev/v1alpha1

metadata:
  name: api-service

endpoints:
  - name: api
    port: 8080
    type: REST

connections:
  - component: postgres
    endpoint: postgres
    visibility: project
    envBindings:
      host: POSTGRES_HOST
      port: POSTGRES_PORT
  - component: redis
    endpoint: redis
    visibility: project
    envBindings:
      address: REDIS_ADDR

configurations:
  env:
    - name: PORT
      value: "8080"
    - name: POSTGRES_DSN
      value: "postgres://postgres:postgres@postgres:5432/urlshortener?sslmode=disable"
    - name: REDIS_ADDR
      value: "redis:6379"
    - name: OTEL_ENABLED
      value: "true"
    - name: OTEL_EXPORTER_ENDPOINT
      value: "http://opentelemetry-collector.openchoreo-observability-plane.svc.cluster.local:4318"
