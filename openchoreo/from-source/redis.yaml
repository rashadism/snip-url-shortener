apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: redis
spec:
  owner:
    projectName: url-shortener

  componentType:
    kind: ComponentType
    name: deployment/service
  autoDeploy: true

  workflow:
    name: docker

    parameters:
      scope:
        projectName: "url-shortener"
        componentName: "redis"
      repository:
        url: "https://github.com/rashadism/snip-url-shortener"
        revision:
          branch: "v17"
        appPath: "/redis"
      docker:
        context: "/redis"
        filePath: "/redis/Dockerfile"

---
apiVersion: openchoreo.dev/v1alpha1
kind: WorkflowRun
metadata:
  name: redis-build-01
  labels:
    openchoreo.dev/project: "url-shortener"
    openchoreo.dev/component: "redis"
spec:
  workflow:
    name: docker

    parameters:
      scope:
        projectName: "url-shortener"
        componentName: "redis"
      repository:
        url: "https://github.com/rashadism/snip-url-shortener"
        revision:
          branch: "v17"
        appPath: "/redis"
      docker:
        context: "/redis"
        filePath: "/redis/Dockerfile"
