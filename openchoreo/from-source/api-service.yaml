apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: api-service
spec:
  owner:
    projectName: url-shortener

  componentType:
    kind: ComponentType
    name: deployment/service
  autoDeploy: true

  workflow:
    name: docker

    parameters:
      scope:
        projectName: "url-shortener"
        componentName: "api-service"
      repository:
        url: "https://github.com/rashadism/snip-url-shortener"
        revision:
          branch: "main"
        appPath: "/api-service"
      docker:
        context: "/api-service"
        filePath: "/api-service/Dockerfile"

---
apiVersion: openchoreo.dev/v1alpha1
kind: WorkflowRun
metadata:
  name: api-service-build-01
  labels:
    openchoreo.dev/project: "url-shortener"
    openchoreo.dev/component: "api-service"
spec:
  workflow:
    name: docker

    parameters:
      scope:
        projectName: "url-shortener"
        componentName: "api-service"
      repository:
        url: "https://github.com/rashadism/snip-url-shortener"
        revision:
          branch: "main"
        appPath: "/api-service"
      docker:
        context: "/api-service"
        filePath: "/api-service/Dockerfile"
