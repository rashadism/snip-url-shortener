apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: frontend
  namespace: default
spec:
  owner:
    projectName: url-shortener

  componentType:
    kind: ClusterComponentType
    name: deployment/web-application

  autoDeploy: true

  workflow:
    kind: ClusterWorkflow
    name: dockerfile-builder
    parameters:
      repository:
        url: "https://github.com/rashadism/snip-url-shortener"
        revision:
          branch: "v18"
        appPath: "/frontend"
      docker:
        context: "/frontend"
        filePath: "/frontend/Dockerfile"

---
apiVersion: openchoreo.dev/v1alpha1
kind: WorkflowRun
metadata:
  name: frontend-build-01
  labels:
    openchoreo.dev/project: "url-shortener"
    openchoreo.dev/component: "frontend"
spec:
  workflow:
    kind: ClusterWorkflow
    name: dockerfile-builder
    parameters:
      repository:
        url: "https://github.com/rashadism/snip-url-shortener"
        revision:
          branch: "v18"
        appPath: "/frontend"
      docker:
        context: "/frontend"
        filePath: "/frontend/Dockerfile"
