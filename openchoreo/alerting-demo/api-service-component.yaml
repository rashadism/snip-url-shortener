apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: api-service
  namespace: default
spec:
  owner:
    projectName: url-shortener

  componentType: deployment/service
  autoDeploy: true

  traits:
    - name: observability-alert-rule
      instanceName: api-service-redis-error-log-alert
      parameters:
        description: "Alert when api-service logs indicate Redis connection errors"
        severity: "critical"
        source:
          type: "log"
          query: "failed to get URL from redis"
        condition:
          window: "1m"
          interval: "1m"
          operator: "gt"
          threshold: 5

  parameters:
    exposed: true
    replicas: 1
    port: 8080
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
