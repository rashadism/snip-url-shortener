---
# Misconfigure the api-service Postgres DSN
apiVersion: openchoreo.dev/v1alpha1
kind: ReleaseBinding
metadata:
  name: api-service-development
  namespace: default
spec:
  owner:
    projectName: url-shortener
    componentName: api-service
  environment: development
  workloadOverrides:
    containers:
      main:
        env:
          - key: POSTGRES_DSN
            value: "postgres://postgres:postgres@postgresss:5432/urlshortener?sslmode=disable"
