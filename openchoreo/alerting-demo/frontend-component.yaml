apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: frontend
  namespace: default
spec:
  owner:
    projectName: url-shortener

  componentType: deployment/web-application
  autoDeploy: true

  traits:
    - name: observability-alert-rule
      instanceName: frontend-5xx-log-alert
      parameters:
        description: "Alert when frontend logs indicate HTTP 500 responses"
        severity: "critical"
        source:
          type: "log"
          query: "status=500"
        condition:
          window: "1m"
          interval: "1m"
          operator: "gt"
          threshold: 5

  parameters:
    replicas: 1
    port: 3000
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
