apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: api-service
  namespace: default
spec:
  owner:
    projectName: url-shortener

  componentType:
    kind: ComponentType
    name: deployment/service
  autoDeploy: true

  parameters:
    exposed: true
    replicas: 1
    port: 8080
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"

---
apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: api-service
  namespace: default
spec:
  owner:
    componentName: api-service
    projectName: url-shortener
  endpoints:
    http:
      type: HTTP
      port: 8080
  connections:
    postgres:
      type: api
      params:
        projectName: url-shortener
        componentName: postgres
        endpoint: tcp
      inject:
        env:
          - name: POSTGRES_DSN
            value: "postgres://postgres:postgres@{{ .host }}:{{ .port }}/urlshortener?sslmode=disable"
    redis:
      type: api
      params:
        projectName: url-shortener
        componentName: redis
        endpoint: tcp
      inject:
        env:
          - name: REDIS_ADDR
            value: "{{ .host }}:{{ .port }}"
  container:
    image: rashadxyz/snip-api-service:v0.2.5
    env:
      - key: PORT
        value: "8080"
      - key: POSTGRES_DSN
        value: "postgres://postgres:postgres@postgres:5432/urlshortener?sslmode=disable"
      - key: REDIS_ADDR
        value: "redis:6379"
      - key: OTEL_ENABLED
        value: "true"
      - key: OTEL_EXPORTER_ENDPOINT
        value: "http://opentelemetry-collector.openchoreo-observability-plane.svc.cluster.local:4318"
