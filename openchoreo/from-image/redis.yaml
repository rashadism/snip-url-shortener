apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: redis
  namespace: default
spec:
  owner:
    projectName: url-shortener

  componentType:
    kind: ComponentType
    name: deployment/service
  autoDeploy: true

  parameters:
    replicas: 1
    port: 6379
    resources:
      requests:
        cpu: "50m"
        memory: "128Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"

---
apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: redis
  namespace: default
spec:
  owner:
    componentName: redis
    projectName: url-shortener
  endpoints:
    tcp:
      type: TCP
      port: 6379
  container:
    image: redis:7-alpine
